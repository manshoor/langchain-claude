[project]
name = "langchain-claude"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.1",
    "fastembed>=0.9.1",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-text-splitters>=1.1.3",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Scripts live in the repo root, so tests import them from there.
pythonpath = ["."]

[tool.ruff]
line-length = 100
