[project]
name = "langchain-claude"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.1",
    "fastembed>=0.9.1",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2,<6",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "rank-bm25>=0.2.2",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "acme_support"  # shared code in src/acme_support/

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the numbered scripts and the evals by file name.
pythonpath = ["scripts", "evals"]

[tool.ruff]
line-length = 100
